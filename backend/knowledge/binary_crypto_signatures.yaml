crypto_libraries:
  - name: "libcrypto"
    patterns: ["libcrypto.so", "libcrypto.dylib", "libcrypto-3.dll", "libcrypto-1_1.dll"]
    family: "OpenSSL"
    description: "OpenSSL core cryptographic primitives library"
  - name: "libssl"
    patterns: ["libssl.so", "libssl.dylib", "libssl-3.dll", "libssl-1_1.dll"]
    family: "OpenSSL"
    description: "OpenSSL SSL/TLS protocol library"
  - name: "bcrypt"
    patterns: ["bcrypt.dll"]
    family: "Windows CNG"
    description: "Windows Best Cryptography Next Generation core DLL"
  - name: "crypt32"
    patterns: ["crypt32.dll"]
    family: "Windows CryptoAPI"
    description: "Windows legacy Cryptographic API services"
  - name: "ncrypt"
    patterns: ["ncrypt.dll"]
    family: "Windows CNG"
    description: "Windows CNG Key Storage Provider"
  - name: "libsodium"
    patterns: ["libsodium.so", "libsodium.dylib", "libsodium.dll"]
    family: "Sodium"
    description: "Modern portable cryptographic library"
  - name: "libgnutls"
    patterns: ["libgnutls.so", "libgnutls.dylib"]
    family: "GnuTLS"
    description: "GNU Transport Layer Security Library"
  - name: "libwolfssl"
    patterns: ["libwolfssl.so", "libwolfssl.dylib", "wolfssl.dll"]
    family: "wolfSSL"
    description: "Embedded lightweight SSL/TLS library"
  - name: "libmbedtls"
    patterns: ["libmbedcrypto.so", "libmbedtls.so", "mbedtls.dll"]
    family: "mbedTLS"
    description: "ARM mbed TLS / PolarSSL embedded cryptographic engine"
  - name: "liboqs"
    patterns: ["liboqs.so", "liboqs.dylib", "oqs.dll"]
    family: "Open Quantum Safe"
    description: "Open Quantum Safe Post-Quantum Cryptography library"
