# ==========================================
# DEPENDENCY TO CAPABILITY MAPPINGS
# (Presence in manifest/lockfile indicates capability, NOT actual use)
# ==========================================
dependency_capabilities:
  cryptography:
    ecosystem: "python"
    capabilities: ["AES", "RSA", "ECDSA", "Ed25519", "ChaCha20", "SHA-256", "HMAC"]
  pycryptodome:
    ecosystem: "python"
    capabilities: ["AES", "DES", "TripleDES", "RSA", "DSA", "MD5", "SHA-256"]
  pycryptodomex:
    ecosystem: "python"
    capabilities: ["AES", "DES", "TripleDES", "RSA", "DSA", "MD5", "SHA-256"]
  bouncycastle:
    ecosystem: "java"
    capabilities: ["AES", "RSA", "ECDSA", "Kyber", "Dilithium", "SHA-256"]
  bcprov-jdk18on:
    ecosystem: "java"
    capabilities: ["AES", "RSA", "ECDSA", "Kyber", "Dilithium", "SHA-256"]
  ring:
    ecosystem: "rust"
    capabilities: ["AES-GCM", "ChaCha20-Poly1305", "RSA", "ECDSA", "Ed25519", "SHA-256"]
  aes-gcm:
    ecosystem: "rust"
    capabilities: ["AES-GCM", "AES-128-GCM", "AES-256-GCM"]
  rsa:
    ecosystem: "rust"
    capabilities: ["RSA"]
  sha2:
    ecosystem: "rust"
    capabilities: ["SHA-256", "SHA-512"]
  ed25519-dalek:
    ecosystem: "rust"
    capabilities: ["Ed25519"]
  crypto-js:
    ecosystem: "npm"
    capabilities: ["AES", "DES", "TripleDES", "Rabbit", "RC4", "MD5", "SHA-1", "SHA-256"]
  jsonwebtoken:
    ecosystem: "npm"
    capabilities: ["HMAC", "RSA", "ECDSA"]
  jose:
    ecosystem: "npm"
    capabilities: ["JWE", "JWS", "AES-GCM", "RSA-OAEP", "ECDH-ES"]
